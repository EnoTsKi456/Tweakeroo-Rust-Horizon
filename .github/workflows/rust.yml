name: Rust tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run standalone runtime tests
        run: cargo test --manifest-path Cargo.toml
      - name: Package source-only Horizon mod candidate
        run: python3 tools/package.py
      - name: Upload .hnmod candidate
        uses: actions/upload-artifact@v4
        with:
          name: tweakeroo-rust-hnmod-candidate
          path: target/tweakeroo_rust-0.3.0.hnmod
          if-no-files-found: error
